[project]
name = "gatesmith-review"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.27", "PyJWT[crypto]>=2.9", "pydantic>=2.9,<3", "ruamel.yaml>=0.18", "google-genai>=1.0", "qscore"]
[project.scripts]
gatesmith-review = "qscore_review.app:main"
[tool.uv.sources]
qscore = { path = "../qscore", editable = true }
[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/qscore_review"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S110", "RUF"]
