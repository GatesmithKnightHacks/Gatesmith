[project]
name = "qscore"
version = "0.1.0"
description = "Scoring engine for quantum circuits: validate, compile, measure, diagnose, request improvements, verify."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "qiskit>=2.5,<3",
    # CPU Aer. On the W7900 the ROCm build replaces it (never both: same `qiskit_aer` module).
    "qiskit-aer>=0.17,<0.18",
    "qiskit-ibm-runtime>=0.50",
    "qiskit-qasm3-import>=0.6",
    # Imported directly for QASM3ParsingError, which qasm3.loads lets escape (CP-0027).
    "openqasm3>=1.0",
    "mqt.qcec>=3.11,<4",
    "numpy>=2.0",
    "scipy>=1.14",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "rich>=13.9",
    "ruamel.yaml>=0.18",
    "jinja2>=3.1",
]

[project.optional-dependencies]
gpu-rocm = []  # marker only: the ROCm Aer wheel is installed from the private Hub repo, never from PyPI
hf = ["openai>=1.50", "huggingface_hub>=1.0", "pyarrow>=17"]
ui = ["gradio>=5", "fastapi>=0.115", "uvicorn>=0.32"]
neon = ["psycopg[binary]>=3.2"]

[project.scripts]
qscore = "qscore.cli:app"

[project.entry-points."qscore.metrics"]
[project.entry-points."qscore.layers"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "gpu: needs the W7900 with the ROCm Aer build",
    "slow: CPU, longer than 30 s",
    "neon: needs QSCORE_TEST_NEON_DSN (Neon dev branch)",
    "hub: needs HF_TOKEN with write access to a test repo",
    "llm: needs a running model endpoint",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S110", "RUF"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["qscore.schemas.*", "qscore.metrics.*", "qscore.diagnose.*", "qscore.verify.*"]
strict = true

[[tool.mypy.overrides]]
module = ["qiskit.*", "qiskit_ibm_runtime.*"]
ignore_missing_imports = true
